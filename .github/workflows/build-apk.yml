name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build downloadable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production web app
        run: pnpm build

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Build standard debug APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare APK download asset
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mediveu-ERP.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediveu-android-apk
          path: Mediveu-ERP.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK for website download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: android-${{ github.run_number }}-${{ github.run_attempt }}
        run: gh release create "$TAG_NAME" Mediveu-ERP.apk --repo "$GITHUB_REPOSITORY" --title "MEDIVEU Android APK" --notes "Debug-signed APK built from commit $GITHUB_SHA. This build does not require release keystore secrets." --latest
