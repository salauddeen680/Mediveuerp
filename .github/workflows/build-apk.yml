name: Build signed Android release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build signed release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production web app
        run: pnpm build

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore_base64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"
          if [ -z "$keystore_base64" ]; then
            echo "Missing required GitHub Actions secret: ANDROID_KEYSTORE_BASE64 (the existing release keystore, Base64-encoded)."
            exit 1
          fi
          if (( ${#keystore_base64} % 4 != 0 )) || [[ ! "$keystore_base64" =~ ^[A-Za-z0-9+/]*={0,2}$ ]]; then
            echo "ANDROID_KEYSTORE_BASE64 is not valid Base64; the secret may have been truncated or corrupted during paste. Re-enter the existing keystore value."
            exit 1
          fi
          umask 077
          keystore_path="$RUNNER_TEMP/mediveu-release.jks"
          if ! printf '%s' "$keystore_base64" | base64 --decode > "$keystore_path"; then
            rm -f "$keystore_path"
            echo "Could not decode ANDROID_KEYSTORE_BASE64; the secret may have been truncated or corrupted during paste. Re-enter the existing keystore value."
            exit 1
          fi
          if [ ! -s "$keystore_path" ]; then
            rm -f "$keystore_path"
            echo "Decoded ANDROID_KEYSTORE_BASE64 is empty; the secret may have been truncated or corrupted during paste."
            exit 1
          fi
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release APK and Play Store AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Upload signed APK and Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: mediveu-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/mediveu-release.jks"
        
