<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Google Verification Tag -->
    <meta name="google-site-verification" content="CNXI2jHpJOiAG6r97H768wmoPW6CjvNMa2C3nobbeqs" />
    
    <title>MEDIVEU ERP</title>
    
    <!-- Yeh rahi aapke naye Logo/Favicon ki line -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- Yeh rahi App Install (PWA) ke liye Manifest ki line -->
    <link rel="manifest" href="/manifest.json" />
    
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((registration) => {
              console.log('Service Worker register ho gaya!', registration.scope);
            })
            .catch((error) => {
              console.log('Service Worker fail ho gaya:', error);
            });
        });
      }
    </script>
  </body>
</html>
